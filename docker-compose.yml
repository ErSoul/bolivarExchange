services:
  app:
    build:
      context: .
      target: app
    image: cambios-veneco:app
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
    volumes:
      - database:/var/www/html/database
      - storage:/var/www/html/storage

  nginx:
    build:
      context: .
      target: nginx
    image: cambios-veneco:nginx
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app

  scheduler:
    build:
      context: .
      target: app
    image: cambios-veneco:app
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
    volumes:
      - database:/var/www/html/database
      - storage:/var/www/html/storage
    depends_on:
      - app

volumes:
  database:
  storage: